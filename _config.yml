remote_theme             : "mmistakes/minimal-mistakes"
minimal_mistakes_skin    : "mint"  # Was "air", now using a friendlier color palette

locale                   : "en-US"
title                    : "Donald Loveland"
title_separator          : "-"
subtitle                 : "LLM Adaptation, Personalization, and Graph Learning"
name                     : "Donald Loveland"
description              : "Donald Loveland researches LLM adaptation, generative recommendation, training efficiency, and graph learning at Snap Research."
url                      : "https://www.donaldloveland.com"
baseurl                  : ""
repository               : "dloveland/donaldloveland.github.io"

masthead_title           : "Donald Loveland"
teaser                   : "/assets/images/preview.png"
og_image                 : "/assets/images/preview.png"

words_per_minute         : 200


author:
  name             : "Donald Loveland"
  avatar           : "/assets/images/donald-loveland-2026.jpg"
  bio              : "Research Scientist at Snap Research. LLM adaptation, personalization, training efficiency, and graph learning."
  location         : "Bellevue, Washington"
  email            : "dlovelan@umich.edu"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:dlovelan@umich.edu"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/donald-loveland/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/dloveland"

footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/donald-loveland/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/dloveland"

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

include:
  - .htaccess
  - _pages
exclude:
  - CV.png
  - CV.pdf
  - assets/images/organizations/SOURCES.md
  - scripts
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - tmp
  - /docs
  - /test
  - scripts
  - tests

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone:

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments:
      share: true
      related: true
  - scope:
      path: ""
      type: pubs
    values:
      layout: single
      author_profile: false
      read_time: true
      comments: true
      share: true
      related: true
