    logo: /assets/images/organizations/snap.svg
    role: Research Scientist
    context: User Modeling and Personalization · Bellevue, Washington
    description: Research on LLM-based generative recommendation, focusing on training efficiency, popularity bias, and scalable reasoning.
    highlights:
      - Analyze how models encode semantic and behavioral signals, identifying sources of memorization and popularity bias to improve token initialization, semantic ID construction, and training tasks.
      - Developed core methodology for SnapLGR, enabling the adaptation of Qwen3 models for production recommendation across Snapchat content and ads retrieval.
      - Advise intern projects on generative recommendation, conversational recommendation, and graph foundation models.
