name: Donald Loveland
role: Research Scientist
organization: Snap Research
organization_url: https://research.snap.com
intro: I study LLM adaptation, personalization, and training efficiency, with a focus on understanding how models learn and using those insights to improve them.
bio: >-
  I am a Research Scientist on the User Modeling and Personalization team at
  [Snap Research](https://research.snap.com), where I work on LLM adaptation and
  efficient training for generative recommendation. I earned my Ph.D. in Computer
  Science and Engineering at the
  [University of Michigan, Ann Arbor](https://cse.engin.umich.edu) in April 2026,
  advised by [Danai Koutra](https://gemslab.github.io). My doctoral research was
  supported by an
  [NSF Graduate Research Fellowship](https://cse.engin.umich.edu/people/honors-and-awards/awarded-graduate-fellowships/)
  and a
  [Rackham Merit Fellowship](https://rackham.umich.edu/funding/funding-types/rackham-merit-fellowship-program/).
email: dlovelan@umich.edu
scholar_url: https://scholar.google.com/citations?user=BvbMe3YAAAAJ&hl=en
github_url: https://github.com/dloveland
linkedin_url: https://www.linkedin.com/in/donald-loveland/
cv_url: /assets/images/25_CV_Yr4.pdf
topics:
  - id: recommendations
    label: Recommendations
    description: Adapting LLMs for generative recommendation, with a focus on training efficiency, item representations, and popularity bias.
  - id: graphs
    label: Graph learning
    description: Understanding how local graph structure shapes what a model can learn.
  - id: trustworthy
    label: Trustworthy ML
    description: Investigating fairness, robustness, and explanations to better understand the behavior of machine learning models.
  - id: science
    label: Scientific applications
    description: Applying machine learning to scientific questions, from molecular structure to materials properties.
